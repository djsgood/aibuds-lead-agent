name: Crawler checks
on:
  push:
    branches: ["feat/zyte-mcp", "dev/autonomous-lead-pipeline"]
  pull_request:
permissions:
  contents: read
jobs:
  crawler:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt -r requirements-direct.txt
      - run: python -m scrapy list
      - run: python -m pytest tests -q
      - run: python tests/fixture_crawl.py
      - run: python tests/fixture_pipeline.py
      - run: python setup.py sdist
