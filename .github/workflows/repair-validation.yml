name: Repair validation
on:
  push:
    branches: [repair/production-discovery]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - name: Compile source
        run: python -m compileall -q lead_agent aibuds_crawler tests
      - name: Offline tests with outbound sockets blocked
        run: |
          python - <<'PY'
          import socket
          import pytest
          def blocked(*args, **kwargs):
              raise RuntimeError("Live network disabled during validation")
          socket.socket.connect = blocked
          socket.socket.connect_ex = blocked
          raise SystemExit(pytest.main(["tests", "-q"]))
          PY
      - name: Dry-run configuration
        run: python -m lead_agent run --config config/targets.daily.json
