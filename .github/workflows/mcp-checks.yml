name: MCP checks
on:
  push:
    branches: ["feat/zyte-mcp"]
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r mcp/requirements.txt
      - run: python -m unittest discover -s mcp -v
      - name: Import and tool discovery
        env:
          GITHUB_CLIENT_ID: test
          GITHUB_CLIENT_SECRET: test-secret
          PUBLIC_BASE_URL: https://example.com
          JWT_SIGNING_KEY: test-signing-key-for-ci-only-do-not-use-in-production
        run: |
          cd mcp
          python -c "import asyncio; from fastmcp import Client; from server import mcp; exec('async def check():\n async with Client(mcp) as c:\n  tools = await c.list_tools()\n  assert {t.name for t in tools} == {\"collect_business_contacts\", \"list_crawler_spiders\"}'); asyncio.run(check())"
